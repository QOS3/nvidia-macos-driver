name: nmhda
on:
  workflow_dispatch:
  push:
    branches: [loq-perf]
    paths: ['kexts/NMHDA/**', '.github/workflows/nmhda.yml']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $X"
          sudo xcode-select -s "$X/Contents/Developer"; xcrun clang --version; xcrun --sdk macosx --show-sdk-version
      - name: Lilu DEBUG SDK and MacKernelSDK
        run: |
          mkdir -p lilu
          curl -fsSL https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip -o lilu.zip
          unzip -q lilu.zip -d lilu
          git clone -q --depth 1 https://github.com/acidanthera/MacKernelSDK.git mksdk
          ls -la lilu mksdk/Headers
      - name: Build base (3.0, main) and loq-perf
        run: |
          LILU_KEXT=$(find "$GITHUB_WORKSPACE/lilu" -maxdepth 2 -name "Lilu.kext" -type d | head -n 1)
          [ -n "$LILU_KEXT" ] || { echo "STOP: Lilu.kext not found"; exit 1; }
          build() {
            rm -rf "src-$2" "out/$2" && mkdir -p "src-$2" "out/$2"
            git archive "$1" kexts/NMHDA build | tar x -C "src-$2"
            bash "src-$2/kexts/NMHDA/build.sh" "$LILU_KEXT" "$GITHUB_WORKSPACE/mksdk" "$GITHUB_WORKSPACE/out/$2"
            echo "$2: warnings $(grep -c ': warning:' "out/$2/NMHDA.err" || true), minos $(vtool -show-build "out/$2/NMHDA.kext/Contents/MacOS/NMHDA" | awk '/minos/{print $2; exit}')"
            git rev-parse "$1" > "out/$2/rev.txt"
            nm -gU "out/$2/NMHDA.kext/Contents/MacOS/NMHDA" | awk '{print $3}' | sort > "out/$2/exports.txt"
            nm -u  "out/$2/NMHDA.kext/Contents/MacOS/NMHDA" | sort -u > "out/$2/undefs.txt"
            strings -a "out/$2/NMHDA.kext/Contents/MacOS/NMHDA" | sort -u > "out/$2/strings.txt"
            shasum -a 256 "out/$2/NMHDA.kext/Contents/MacOS/NMHDA"
          }
          build origin/main base
          build HEAD loq
          ls -la out/*
          echo "exports only in base:"; comm -23 out/base/exports.txt out/loq/exports.txt | head
          echo "exports only in loq:";  comm -13 out/base/exports.txt out/loq/exports.txt | head
          echo "undefs only in base:";  comm -23 out/base/undefs.txt  out/loq/undefs.txt  | head -30
          echo "undefs only in loq:";   comm -13 out/base/undefs.txt  out/loq/undefs.txt  | head -30
      - uses: actions/upload-artifact@v4
        with: { name: NMHDA, path: out/ }
